<!DOCTYPE html>
<html>
    <head>
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div class="image">
                <img src="flowers.jpg">
            </div>
            <div class="right-side">
                <div class="intro">
                    <p>This is not a real online service! You know you need something
                        like this in your life to help you realize your deepest dreams.
                        Sign up now to get started.
                    </p>
                    <p>
                        You know you want to.
                    </p>
                </div>
                <div class="form-div">
                    <form action="example.com/path" method="post">
                        <fieldset class="field-stuff">
                                <legend>Let's do this</legend>
                                <div class="name-stuff">
                                    <div class="first-name-div">
                                        <label for="first_name">FIRST NAME</label>
                                        <input type="text" id="first_name" name="first_name" placeholder="john" required>
                                    </div>
                                    <div class="last-name-div">
                                        <label for="last_name">LAST NAME</label>
                                        <input type="text" id="last_name" name="last_name" placeholder="smith" required>
                                    </div>
                                </div>
                                
                                <div class="contact-stuff">
                                    <div class="email-stuff">
                                        <label for="user_email">EMAIL</label>
                                        <input type="email" id="user_email" name="email" placeholder="you@example.com" required>
                                    </div>
                                    
                                    <div class="num-stuff">
                                        <label for="phone_number">PHONE NUMBER</label>
                                        <input type="tel" id="phone_number" name="phone_number" pattern="[0-9+\-\s()]{7,15}" required>
                                    </div>
                                </div>
                                
                            
                                <div class="password-stuff">
                                    <div class="pass-stuff">   
                                        <label for="user_password">PASSWORD</label>
                                        <input type="password" id="user_password" name="password" required maxlength="10">
                                    </div>
                                    <div class="re-pass-stuff">

                                        <label for="user_password_confirm">CONFIRM PASSWORD</label>
                                        <input type="password" id="user_password_confirm" name="password_confirm" required minlength="10">
                                    </div>
                                </div>

                            
                             
                        </fieldset>
                    </form>
                    <div class="create-account-section">
                        <button>Create Account</button>
                        <p>Already have an account?<a href="">log in</a></p>
                    </div>
                    
                </div>
            </div>
        </div>
    </body>
</html>
